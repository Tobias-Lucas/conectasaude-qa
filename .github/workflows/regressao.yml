name: regressao-conectasaude

# Todo commit dispara. workflow_dispatch fica aqui porque, num fork novo,
# o Actions precisa de um disparo manual na primeira vez.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      # A senha nao mora no codigo. Crie o secret em
      # Settings > Secrets and variables > Actions > New repository secret.
      SENHA_TESTE: ${{ secrets.SENHA_TESTE }}
      # O "hoje" do caso, fixo, para o resultado nao depender do calendario
      # nem do fuso do runner.
      HOJE: 27/10/2026

    steps:
      - uses: actions/checkout@v4            # testa exatamente a versao do commit

      - name: a senha existe?
        run: |
          if [ -z "$SENHA_TESTE" ]; then
            echo "::error::O secret SENHA_TESTE nao existe neste repositorio."
            echo "Settings > Secrets and variables > Actions > New repository secret, com o nome SENHA_TESTE."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: sobe a ConectaSaude de laboratorio
        run: |
          nohup python3 app/servidor.py > servidor.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8800/saude && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8800/saude

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - run: npm i -g newman

      - name: testes de API                  # a regra de negocio, antes da tela
        run: |
          newman run testes-api/conectasaude.postman_collection.json \
            -e testes-api/homologacao.postman_environment.json \
            --reporters cli,junit \
            --reporter-junit-export evidencias/newman.xml

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }

      - name: testes de tela                 # Selenium, Chrome sem janela
        working-directory: testes-tela
        run: mvn -B test -Dheadless=true

      - name: guarda a evidencia             # verde ou vermelha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias
          path: |
            evidencias/
            testes-tela/target/surefire-reports/
            servidor.log
          if-no-files-found: warn
